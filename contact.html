<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Lâm Thành Đạt</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">⚡ TD.DEV</a>
        <div class="nav-links">
            <a href="index.html">Trang chủ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="projects.html">Dự án</a>
            <a href="contact.html" class="active">Liên hệ</a>
            <button id="theme-toggle" class="theme-btn">🌙</button>
        </div>
    </nav>

    <section class="container reveal">
        <h1 class="page-title">Gửi Tin Nhắn Liên Hệ</h1>
        <form action="https://formspree.io/f/xoedpdqd" method="POST" class="card contact-form">
            <label for="name">Họ và tên của bạn</label>
            <input type="text" id="name" name="name" placeholder="Nhập họ tên..." required>

            <label for="email">Địa chỉ Email</label>
            <input type="email" id="email" name="email" placeholder="email@example.com" required>

            <label for="message">Nội dung lời nhắn</label>
            <textarea id="message" name="message" rows="5" placeholder="Nhập nội dung cần trao đổi..." required></textarea>

            <button type="submit" class="btn-primary">Gửi Tin Nhắn</button>
        </form>
    </section>

    <footer>
        <p>© 2026 Lâm Thành Đạt. Deployed on Vercel/Netlify.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
